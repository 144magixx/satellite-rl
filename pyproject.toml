[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-rl"
version = "0.1.0"
description = "Satellite resource allocation research experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch", "numpy", "pandas", "matplotlib", "scipy>=1.11"]

[project.scripts]
satellite-workbench = "satellite_rl.workbench.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"satellite_rl.workbench" = ["static/*.html", "static/*.js", "static/*.css"]

