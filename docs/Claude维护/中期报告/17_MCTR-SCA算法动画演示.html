<style>

html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Source Han Sans SC",sans-serif; }

<!-- ===================== 算法核心：纯计算，不依赖页面，可单独测试 ===================== -->
<script id="sca-core">
var SCA = (function () {
  'use strict';
  var LN2 = Math.log(2);

  // 三个预设例子。a、b 已除以噪声；D 为需求，单位 Mbps；p0 取自第二阶段 13 档离散功率
  var PRESETS = [
    { name: '例子一：两束互扰', a: [5.2, 0.54], b: [0.81, 0.62], D: [90, 60], L: [3, 2], D0: 30, p0: [5, 15], ptot: Infinity,
      story: '波束1有3架飞机，信号系数大；波束2有2架飞机，信号系数小。单机需求 30 Mbps。两束互相干扰，不设总功率上限，每束功率在 0.5—50 W 之间。' },
    { name: '例子二：需求悬殊', a: [10, 1.9], b: [1.1, 0.67], D: [135, 45], L: [3, 1], D0: 45, p0: [15, 15], ptot: 70,
      story: '波束1有3架飞机，信号系数大；波束2只有1架飞机，信号系数小，相对更怕干扰。单机需求 45 Mbps，两束总功率不超过 70 W。' },
    { name: '例子三：总功率受限', a: [6.8, 0.51], b: [0.15, 1.5], D: [120, 40], L: [3, 1], D0: 40, p0: [2, 20], ptot: 70,
      story: '波束1有3架飞机，信号系数大；波束2有1架飞机，信号系数小，而且受波束1的干扰很重。单机需求 40 Mbps，两束总功率不超过 70 W，算法最后会碰到这条上限。' }
  ];

  // 式（5）中单个波束的匹配得分 Λ 及其对容量的导数
  function sgmTerm(C, D, beta) {
    if (C <= 0) return [0, 0];
    var z = C / D;
    var u = z >= 1 ? z - 1 : 1 - 1 / z;
    var du = z >= 1 ? 1 / D : D / (C * C);
    var v = (C - D) / beta;
    var h = Math.sqrt(u * u + v * v);
    var e = Math.exp(-h);
    var dh = h > 0 ? (u * du + v / beta) / h : 0;
    return [1 - Math.pow(1 - e, 3), -3 * (1 - e) * (1 - e) * e * dh];
  }

  // 按原模型计算容量、W、F：C_i = B·min(log2(1+Γ_i), η)，Γ_i = a_i p_i /(1 + b_i p_j)
  function evaluate(m, p) {
    var ev = { p: [p[0], p[1]], C: [0, 0], G: [0, 0], nu: [0, 0], capped: [false, false], Lam: [0, 0], dLam: [0, 0] };
    for (var i = 0; i < 2; i++) {
      var j = 1 - i;
      ev.nu[i] = 1 + m.b[i] * p[j];
      ev.G[i] = m.a[i] * p[i] / ev.nu[i];
      var raw = Math.log2(1 + ev.G[i]);
      ev.capped[i] = raw >= m.eta;
      ev.C[i] = m.B * Math.min(raw, m.eta);
      var s = sgmTerm(ev.C[i], m.D[i], m.beta);
      ev.Lam[i] = s[0];
      ev.dLam[i] = s[1];
    }
    ev.served = Math.min(ev.C[0], m.D[0]) + Math.min(ev.C[1], m.D[1]);
    ev.W = ev.served / m.Dtot;
    ev.F = (ev.Lam[0] + ev.Lam[1]) / 2;
    return ev;
  }

  // 只算 W 与 F，用于画底图
  function lamOnly(C, D, beta) {
    if (C <= 0) return 0;
    var z = C / D, u = z >= 1 ? z - 1 : 1 - 1 / z, v = (C - D) / beta;
    return 1 - Math.pow(1 - Math.exp(-Math.sqrt(u * u + v * v)), 3);
  }
  function WF(m, x, y, out) {
    var c1 = m.B * Math.min(Math.log2(1 + m.a[0] * x / (1 + m.b[0] * y)), m.eta);
    var c2 = m.B * Math.min(Math.log2(1 + m.a[1] * y / (1 + m.b[1] * x)), m.eta);
    out[0] = (Math.min(c1, m.D[0]) + Math.min(c2, m.D[1])) / m.Dtot;
    out[1] = (lamOnly(c1, m.D[0], m.beta) + lamOnly(c2, m.D[1], m.beta)) / 2;
    return out;
  }

  // 式（22）：J_ij = B/((1+Γ_i)ln2) · (χ_i·1{i=j} − Γ_i ψ_ij)/ν_i，达到频谱效率上限时取 0
  function jacobian(m, ev) {
    var J = [[0, 0], [0, 0]];
    for (var i = 0; i < 2; i++) {
      if (ev.capped[i]) continue;
      var j = 1 - i;
      var g = m.B / ((1 + ev.G[i]) * LN2);
      J[i][i] = g * m.a[i] / ev.nu[i];
      J[i][j] = -g * ev.G[i] * m.b[i] / ev.nu[i];
    }
    return J;
  }

  // SGM 梯度：g_F,j = (1/m) Σ_i Λ_i'(C_i) J_ij
  function gradF(ev, J) {
    return [0, 1].map(function (j) { return (ev.dLam[0] * J[0][j] + ev.dLam[1] * J[1][j]) / 2; });
  }

  function model(cfg) {
    var m = Object.assign({ B: 25, eta: 5.5, pmin: 0.5, pmax: 50, delta: 0, lambda0: 5, ptot: Infinity, maxIter: 200 }, cfg);
    m.Dtot = m.D[0] + m.D[1];
    m.beta = m.Dtot / 2;
    m.ev0 = evaluate(m, m.p0);
    m.F0 = m.ev0.F;
    m.thr = m.F0 - m.delta - 1e-12;
    return m;
  }

  // 式（23）的二维线性规划，顶点枚举精确求解。约束写成 a·Δ ≤ b；折线为线性容量恰好等于需求处
  function solveLP(m, p, ev, J, gF, thr, lam, margin) {
    var lo = [0, 1].map(function (j) { return Math.max(m.pmin - p[j], -lam); });
    var hi = [0, 1].map(function (j) { return Math.min(m.pmax - p[j], lam); });
    var cons = [
      { a: [1, 0], b: hi[0], kind: 'box' }, { a: [-1, 0], b: -lo[0], kind: 'box' },
      { a: [0, 1], b: hi[1], kind: 'box' }, { a: [0, -1], b: -lo[1], kind: 'box' }
    ];
    if (isFinite(m.ptot)) cons.push({ a: [1, 1], b: m.ptot - p[0] - p[1], kind: 'budget' });
    var gs = Math.max(Math.abs(gF[0]), Math.abs(gF[1]), 1e-12);
    cons.push({ a: [-gF[0] / gs, -gF[1] / gs], b: (ev.F - thr - margin) / gs, kind: 'sgm' });
    var brk = [];
    for (var i = 0; i < 2; i++) {
      var s = Math.max(Math.abs(J[i][0]), Math.abs(J[i][1]));
      if (s > 0) brk.push({ a: [J[i][0] / s, J[i][1] / s], b: (m.D[i] - ev.C[i]) / s, kind: 'break', beam: i });
    }
    var lines = cons.concat(brk);
    function feas(d) {
      for (var c = 0; c < cons.length; c++) {
        var L = cons[c];
        if (L.a[0] * d[0] + L.a[1] * d[1] > L.b + 1e-9 * (1 + Math.abs(L.b))) return false;
      }
      return true;
    }
    function obj(d) {
      var v = 0;
      for (var i = 0; i < 2; i++) v += Math.min(ev.C[i] + J[i][0] * d[0] + J[i][1] * d[1], m.D[i]);
      return v;
    }
    var verts = [];
    for (var x = 0; x < lines.length; x++) {
      for (var y = x + 1; y < lines.length; y++) {
        var A = lines[x], B = lines[y];
        var det = A.a[0] * B.a[1] - A.a[1] * B.a[0];
        if (Math.abs(det) < 1e-12) continue;
        var d = [(A.b * B.a[1] - A.a[1] * B.b) / det, (A.a[0] * B.b - A.b * B.a[0]) / det];
        if (!feas(d)) continue;
        var dup = false;
        for (var k = 0; k < verts.length; k++) {
          if (Math.abs(verts[k].d[0] - d[0]) < 1e-9 && Math.abs(verts[k].d[1] - d[1]) < 1e-9) { dup = true; break; }
        }
        if (!dup) verts.push({ d: d, val: obj(d), on: [A.kind, B.kind] });
      }
    }
    var out = { lo: lo, hi: hi, cons: cons, brk: brk, margin: margin, lam: lam, verts: verts, obj: obj, feas: feas };
    if (!verts.length) { out.feasible = false; return out; }
    // 目标相同时取步长较小、总功率较省的顶点
    var best = verts[0];
    for (var k2 = 1; k2 < verts.length; k2++) {
      var v = verts[k2], tol = 1e-9 * (1 + Math.abs(best.val));
      if (v.val > best.val + tol) best = v;
      else if (v.val > best.val - tol) {
        var nb = Math.max(Math.abs(best.d[0]), Math.abs(best.d[1])), nv = Math.max(Math.abs(v.d[0]), Math.abs(v.d[1]));
        if (nv < nb - 1e-12 || (nv < nb + 1e-12 && v.d[0] + v.d[1] < best.d[0] + best.d[1])) best = v;
      }
    }
    out.feasible = true;
    out.best = best;
    out.d = best.d;
    out.pred = (best.val - ev.served) / m.Dtot;
    out.linF = ev.F + gF[0] * best.d[0] + gF[1] * best.d[1];
    return out;
  }

  // 子问题可行范围的多边形，用于作图
  function clipPoly(poly, a, b) {
    var out = [];
    for (var i = 0; i < poly.length; i++) {
      var P = poly[i], Q = poly[(i + 1) % poly.length];
      var fp = a[0] * P[0] + a[1] * P[1] - b, fq = a[0] * Q[0] + a[1] * Q[1] - b;
      if (fp <= 0) out.push(P);
      if ((fp <= 0) !== (fq <= 0)) {
        var t = fp / (fp - fq);
        out.push([P[0] + t * (Q[0] - P[0]), P[1] + t * (Q[1] - P[1])]);
      }
    }
    return out;
  }
  function lpPolygon(p, lp) {
    var poly = [[lp.lo[0], lp.lo[1]], [lp.hi[0], lp.lo[1]], [lp.hi[0], lp.hi[1]], [lp.lo[0], lp.hi[1]]];
    lp.cons.forEach(function (c) { if (c.kind !== 'box' && poly.length) poly = clipPoly(poly, c.a, c.b); });
    return poly.map(function (d) { return [p[0] + d[0], p[1] + d[1]]; });
  }

  function add(p, d) { return [p[0] + d[0], p[1] + d[1]]; }
  function ninf(d) { return Math.max(Math.abs(d[0]), Math.abs(d[1])); }

  // MCTR-SCA 主循环，按报告 4.4 节；逐次记录全部中间量供动画使用
  function run(m) {
    var p = m.p0.slice(), ev = evaluate(m, p);
    var lam = m.lambda0, mu = 0, trace = [], k = 0, stop = null;
    while (k < m.maxIter) {
      var J = jacobian(m, ev), gF = gradF(ev, J);
      var rec = { k: k, p: p.slice(), ev: ev, J: J, gF: gF, lam: lam, muIn: mu, mu: mu };
      var lp = solveLP(m, p, ev, J, gF, m.thr, lam, mu * lam * lam);
      if ((!lp.feasible || lp.pred < 1e-7) && mu > 0) {      // 余量使子问题无解或无预测提升：μ 清零重解
        rec.lpFirst = lp;
        rec.muReset = true;
        mu = 0;
        rec.mu = 0;
        lp = solveLP(m, p, ev, J, gF, m.thr, lam, 0);
      }
      rec.lp = lp;
      if (!lp.feasible) {
        rec.outcome = 'lp-infeasible';
        lam /= 2;
      } else if (lp.pred < 1e-7) {
        rec.outcome = 'converged';
        stop = 'converged';
      } else {
        var pc = add(p, lp.d), evc = evaluate(m, pc);
        rec.pc = pc; rec.evc = evc;
        rec.err = ev.F + gF[0] * lp.d[0] + gF[1] * lp.d[1] - evc.F;
        if (evc.W > ev.W + 1e-12 && evc.F >= m.thr) {        // 式（24）：直接接受
          rec.outcome = 'accept';
          p = pc; ev = evc; lam = Math.min(2 * lam, m.pmax); mu = mu / 2;
        } else {
          if (evc.F < m.thr) {
            mu = Math.max(2 * mu, rec.err / Math.pow(Math.max(ninf(lp.d), 1e-9), 2));   // 式（25）
            rec.muAfterErr = mu;
            if (evc.W > ev.W) {                                 // 满足率提高：以半径 λ/2 做一次修复步
              var J2 = jacobian(m, evc), gF2 = gradF(evc, J2);
              var lp2 = solveLP(m, pc, evc, J2, gF2, m.thr, lam / 2, mu * lam * lam / 4);
              rec.repair = { J: J2, gF: gF2, lp: lp2, lam: lam / 2, mu: mu };
              if (lp2.feasible) {
                var pr = add(pc, lp2.d), evr = evaluate(m, pr);
                rec.repair.p = pr; rec.repair.ev = evr;
                if (evr.W > ev.W + 1e-12 && evr.F >= m.thr) {

        P('<b>信赖域</b>是只相信线性近似的范围。这里取以当前点为中心、半边长 ' + H.lam + ' 的正方形，即每个波束的功率变化都不超过 ' + H.lam + '，记作 ‖' + H.Dl + '‖<sub>∞</sub> ≤ ' + H.lam + '。') +

  /* ---------------- 导航与播放 ---------------- */
  function buildNav() {

  }
  function updateNav() {
    var fr = ST.frames[cur];
    Array.prototype.forEach.call($('chips').children, function (el, i) { el.classList.toggle('on', i === fr.chip); });
    Array.prototype.forEach.call($('ticks').children, function (el, i) { el.className = i === cur ? 'on' : i < cur ? 'done' : ''; });
    $('frameNo').textContent = '第 ' + (cur + 1) + ' / ' + ST.frames.length + ' 步';
    $('stepNo').textContent = ST.chips[fr.chip].label.replace(/<[^>]+>/g, '');
  }
  function targetView(fr) { return autoZoom ? fr.view : FULL; }
  function setView(t, instant) {
    if (instant) { V = { x0: t.x0, y0: t.y0, s: t.s }; VT = null; return; }
    if (Math.abs(t.x0 - V.x0) < 1e-12 && Math.abs(t.y0 - V.y0) < 1e-12 && Math.abs(t.s - V.s) < 1e-12) { VT = null; return; }
    VT = { from: { x0: V.x0, y0: V.y0, s: V.s }, to: t, start: performance.now(), dur: 800 };
  }
  function goTo(i, instant) {
    cur = Math.max(0, Math.min(ST.frames.length - 1, i));
    tau = 0; holdT = 0; animating = true;
    var fr = ST.frames[cur];
    $('stepTitle').innerHTML = fr.title;
    $('stepText').innerHTML = fr.html;
    $('stepText').scrollTop = 0;
    setView(targetView(fr), instant);
    updateNav();
    renderAll();
  }
  function setPlaying(v) { playing = v; if (v) animating = true; else animating = false; $('btnPlay').textContent = v ? '暂停' : '播放'; $('btnPlay').classList.toggle('on', v); }
  function renderAll() {
    var fr = ST.frames[cur], t = Math.min(tau, fr.dur);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, CW, CH);
    var bg = getBg(V, fr.feas, VT ? 80 : 200, PR.S);
    ctx.drawImage(bg.cv, PR.L, PR.T, PR.S, PR.S);
    drawAxes(bg);
    ctx.save(); ctx.beginPath(); ctx.rect(PR.L, PR.T, PR.S, PR.S); ctx.clip();
    fr.paint(t);
    ctx.restore();
    if (V.s < FULL.s * 0.6) drawInset(fr);
    ctx.strokeStyle = '#b5afa3'; ctx.lineWidth = 1; ctx.setLineDash([]); ctx.strokeRect(PR.L + 0.5, PR.T + 0.5, PR.S - 1, PR.S - 1);
    updatePanel(fr.panel(t));
  }
  function loop(ts) {
    var dt = lastTs ? Math.min(100, ts - lastTs) : 16; lastTs = ts;
    var fr = ST.frames[cur], changed = false;
    if (VT) {
      var u = ease((performance.now() - VT.start) / VT.dur), a = VT.from, b = VT.to;
      var ls = Math.log(a.s) + (Math.log(b.s) - Math.log(a.s)) * u, s = Math.exp(ls);
      var cx = a.x0 + a.s / 2 + (b.x0 + b.s / 2 - a.x0 - a.s / 2) * u, cy = a.y0 + a.s / 2 + (b.y0 + b.s / 2 - a.y0 - a.s / 2) * u;
      V = { x0: cx - s / 2, y0: cy - s / 2, s: s };
      if (u >= 1) { V = { x0: b.x0, y0: b.y0, s: b.s }; VT = null; }
      changed = true;
    }
    if (playing || animating) {
      if (tau < fr.dur) {
        tau = Math.min(fr.dur, tau + dt * speed); changed = true;
        if (tau >= fr.dur && !playing) animating = false;
      } else if (playing) {
        holdT += dt * speed;
        if (holdT >= fr.hold) { if (cur < ST.frames.length - 1) goTo(cur + 1); else setPlaying(false); }
      }
    }
    if (changed) renderAll();
    requestAnimationFrame(loop);
  }
  function loadPreset(i, instant) {
    BG = {}; lastPanel = {};
    ST = build(i);
    buildNav();
    goTo(0, true);
  }

  $('btnPrev').onclick = function () { goTo(cur - 1); };
  $('btnNext').onclick = function () { goTo(cur + 1); };
  $('btnReplay').onclick = function () { goTo(cur, true); };
  $('btnPlay').onclick = function () {
    if (playing) { setPlaying(false); return; }
    if (cur === ST.frames.length - 1 && tau >= ST.frames[cur].dur) goTo(0);
    setPlaying(true);
  };
  $('speed').onchange = function () { speed = +this.value; };
  $('autoZoom').onchange = function () { autoZoom = this.checked; setView(targetView(ST.frames[cur])); };
  $('chips').onclick = function (e) { var el = e.target.closest('.chip'); if (el) goTo(ST.chips[+el.getAttribute('data-i')].first); };
  $('ticks').onclick = function (e) { var f = e.target.getAttribute('data-f'); if (f !== null) goTo(+f); };
  $('presets').onclick = function (e) { var el = e.target.closest('button'); if (el) { setPlaying(false); loadPreset(+el.getAttribute('data-p')); } };
  window.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') { goTo(cur + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { goTo(cur - 1); e.preventDefault(); }
    else if (e.key === ' ') { $('btnPlay').click(); e.preventDefault(); }
    else if (e.key === 'r' || e.key === 'R') goTo(cur, true);
  });
  window.addEventListener('resize', function () { resize(); renderAll(); });

  /* ---------------- 启动；网址后加 #p=1&f=7&end 可直接打开某一步的末态，#selftest 逐步自检 ---------------- */
  function hashArgs() {
    var o = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) { if (!kv) return; var a = kv.split('='); o[a[0]] = a.length > 1 ? a[1] : true; });
    return o;
  }
  function selftest() {
    var lines = [], errors = 0;
    for (var i = 0; i < SCA.PRESETS.length; i++) {
      loadPreset(i, true);
      var tr = ST.trace, mono = true, feas = true;
      for (var k = 1; k < ST.hist.length; k++) {
        if (ST.hist[k].ev.W < ST.hist[k - 1].ev.W) mono = false;
        if (ST.hist[k].ev.F < ST.m.thr) feas = false;
      }
      for (var f = 0; f < ST.frames.length; f++) {
        try {
          goTo(f, true);
          [0, 0.33, 0.66, 1].forEach(function (u) { tau = ST.frames[f].dur * u; renderAll(); });
        } catch (err) { errors++; lines.push('预设' + i + ' 第' + f + '步出错：' + err.message); }
      }
      lines.push('预设' + i + '：' + ST.frames.length + ' 步；迭代结果 ' + tr.map(function (r) { return r.outcome; }).join(',') +
        '；W ' + ST.m.ev0.W.toFixed(4) + '→' + ST.R.ev.W.toFixed(4) + '；接受点 W 单调 ' + mono + '，SGM 达标 ' + feas);
    }
    lines.unshift('SELFTEST ' + (errors ? 'FAIL' : 'OK') + ' errors=' + errors + ' pageErrors=' + ERR.length);
    var el = $('selftest'); el.textContent = lines.join('\n'); el.style.display = 'block';
  }

  resize();
  var args = hashArgs();
  if (args.selftest) { selftest(); return; }
  loadPreset(+(args.p || 0), true);
  if (args.nozoom) { autoZoom = false; $('autoZoom').checked = false; }
  if (args.f) goTo(+args.f, true);
  if (args.end) { tau = ST.frames[cur].dur; animating = false; renderAll(); }
  if (args.t) { tau = +args.t; animating = false; renderAll(); }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
