<!DOCTYPE html>

<title>MCTR-SCA 功率精细优化算法 · 动画演示</title>
<style>

  font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Source Han Sans SC",sans-serif; }

<!-- ===================== 算法核心：纯计算，不依赖页面，可单独测试 ===================== -->
<script id="sca-core">
var SCA = (function () {
  'use strict';
  var LN2 = Math.log(2);

  // 三个预设例子。a、b 已除以噪声；D 为需求，单位 Mbps；p0 取自第二阶段 13 档离散功率
  var PRESETS = [
    { name: '例子一：两束互扰', a: [5.2, 0.54], b: [0.81, 0.62], D: [90, 60], L: [3, 2], D0: 30, p0: [5, 15], ptot: Infinity,
      story: '波束1有3架飞机，信号系数大；波束2有2架飞机，信号系数小。单机需求 30 Mbps。两束互相干扰，不设总功率上限，每束功率在 0.5—50 W 之间。' },
    { name: '例子二：需求悬殊', a: [10, 1.9], b: [1.1, 0.67], D: [135, 45], L: [3, 1], D0: 45, p0: [15, 15], ptot: 70,
      story: '波束1有3架飞机，信号系数大；波束2只有1架飞机，信号系数小，相对更怕干扰。单机需求 45 Mbps，两束总功率不超过 70 W。' },
    { name: '例子三：总功率受限', a: [6.8, 0.51], b: [0.15, 1.5], D: [120, 40], L: [3, 1], D0: 40, p0: [2, 20], ptot: 70,
      story: '波束1有3架飞机，信号系数大；波束2有1架飞机，信号系数小，而且受波束1的干扰很重。单机需求 40 Mbps，两束总功率不超过 70 W，算法最后会碰到这条上限。' }
  ];

  // 式（5）中单个波束的匹配得分 Λ 及其对容量的导数
  function sgmTerm(C, D, beta) {
    if (C <= 0) return [0, 0];
    var z = C / D;
    var u = z >= 1 ? z - 1 : 1 - 1 / z;
    var du = z >= 1 ? 1 / D : D / (C * C);
    var v = (C - D) / beta;
    var h = Math.sqrt(u * u + v * v);
    var e = Math.exp(-h);
    var dh = h > 0 ? (u * du + v / beta) / h : 0;
    return [1 - Math.pow(1 - e, 3), -3 * (1 - e) * (1 - e) * e * dh];
  }

  // 按原模型计算容量、W、F：C_i = B·min(log2(1+Γ_i), η)，Γ_i = a_i p_i /(1 + b_i p_j)
  function evaluate(m, p) {
    var ev = { p: [p[0], p[1]], C: [0, 0], G: [0, 0], nu: [0, 0], capped: [false, false], Lam: [0, 0], dLam: [0, 0] };
    for (var i = 0; i < 2; i++) {
      var j = 1 - i;
      ev.nu[i] = 1 + m.b[i] * p[j];
      ev.G[i] = m.a[i] * p[i] / ev.nu[i];
      var raw = Math.log2(1 + ev.G[i]);
      ev.capped[i] = raw >= m.eta;
      ev.C[i] = m.B * Math.min(raw, m.eta);
      var s = sgmTerm(ev.C[i], m.D[i], m.beta);
      ev.Lam[i] = s[0];
      ev.dLam[i] = s[1];
    }
    ev.served = Math.min(ev.C[0], m.D[0]) + Math.min(ev.C[1], m.D[1]);
    ev.W = ev.served / m.Dtot;
    ev.F = (ev.Lam[0] + ev.Lam[1]) / 2;
    return ev;
  }

  // 只算 W 与 F，用于画底图
  function lamOnly(C, D, beta) {
    if (C <= 0) return 0;
    var z = C / D, u = z >= 1 ? z - 1 : 1 - 1 / z, v = (C - D) / beta;
    return 1 - Math.pow(1 - Math.exp(-Math.sqrt(u * u + v * v)), 3);
  }
  function WF(m, x, y, out) {
    var c1 = m.B * Math.min(Math.log2(1 + m.a[0] * x / (1 + m.b[0] * y)), m.eta);
    var c2 = m.B * Math.min(Math.log2(1 + m.a[1] * y / (1 + m.b[1] * x)), m.eta);
    out[0] = (Math.min(c1, m.D[0]) + Math.min(c2, m.D[1])) / m.Dtot;
    out[1] = (lamOnly(c1, m.D[0], m.beta) + lamOnly(c2, m.D[1], m.beta)) / 2;
    return out;
  }

  // 式（23）：J_ij = B/((1+Γ_i)ln2) · (χ_i·1{i=j} − Γ_i ψ_ij)/ν_i，达到频谱效率上限时取 0
  function jacobian(m, ev) {
    var J = [[0, 0], [0, 0]];
    for (var i = 0; i < 2; i++) {
      if (ev.capped[i]) continue;
      var j = 1 - i;
      var g = m.B / ((1 + ev.G[i]) * LN2);
      J[i][i] = g * m.a[i] / ev.nu[i];
      J[i][j] = -g * ev.G[i] * m.b[i] / ev.nu[i];
    }
    return J;
  }

  // SGM 梯度：g_F,j = (1/m) Σ_i Λ_i'(C_i) J_ij
  function gradF(ev, J) {
    return [0, 1].map(function (j) { return (ev.dLam[0] * J[0][j] + ev.dLam[1] * J[1][j]) / 2; });
  }

  function model(cfg) {
    var m = Object.assign({ B: 25, eta: 5.5, pmin: 0.5, pmax: 50, delta: 0, lambda0: 5, ptot: Infinity, maxIter: 200 }, cfg);
    m.Dtot = m.D[0] + m.D[1];
    m.beta = m.Dtot / 2;
    m.ev0 = evaluate(m, m.p0);
    m.F0 = m.ev0.F;
    m.thr = m.F0 - m.delta - 1e-12;
    return m;
  }

  // 式（24）的二维线性规划，顶点枚举精确求解。约束写成 a·Δ ≤ b；折线为线性容量恰好等于需求处
  function solveLP(m, p, ev, J, gF, thr, lam, margin) {
    var lo = [0, 1].map(function (j) { return Math.max(m.pmin - p[j], -lam); });
    var hi = [0, 1].map(function (j) { return Math.min(m.pmax - p[j], lam); });
    var cons = [
      { a: [1, 0], b: hi[0], kind: 'box' }, { a: [-1, 0], b: -lo[0], kind: 'box' },
      { a: [0, 1], b: hi[1], kind: 'box' }, { a: [0, -1], b: -lo[1], kind: 'box' }
    ];
    if (isFinite(m.ptot)) cons.push({ a: [1, 1], b: m.ptot - p[0] - p[1], kind: 'budget' });
    var gs = Math.max(Math.abs(gF[0]), Math.abs(gF[1]), 1e-12);
    cons.push({ a: [-gF[0] / gs, -gF[1] / gs], b: (ev.F - thr - margin) / gs, kind: 'sgm' });
    var brk = [];
    for (var i = 0; i < 2; i++) {
      var s = Math.max(Math.abs(J[i][0]), Math.abs(J[i][1]));
      if (s > 0) brk.push({ a: [J[i][0] / s, J[i][1] / s], b: (m.D[i] - ev.C[i]) / s, kind: 'break', beam: i });
    }
    var lines = cons.concat(brk);
    function feas(d) {
      for (var c = 0; c < cons.length; c++) {
        var L = cons[c];
        if (L.a[0] * d[0] + L.a[1] * d[1] > L.b + 1e-9 * (1 + Math.abs(L.b))) return false;
      }
      return true;
    }
    function obj(d) {
      var v = 0;
      for (var i = 0; i < 2; i++) v += Math.min(ev.C[i] + J[i][0] * d[0] + J[i][1] * d[1], m.D[i]);
      return v;
    }
    var verts = [];
    for (var x = 0; x < lines.length; x++) {
      for (var y = x + 1; y < lines.length; y++) {
        var A = lines[x], B = lines[y];
        var det = A.a[0] * B.a[1] - A.a[1] * B.a[0];
        if (Math.abs(det) < 1e-12) continue;

                }

              if (!rec.outcome) rec.outcome = 'repair-fail';
            } else rec.outcome = 'reject-sgm';

<!-- 符号词典：自动包裹、即时提示、符号表。内容由 html_test_sca/inject_symkit.js 从 symkit.js 与 symdict_sca.js 写入 -->
<script id="sca-symkit">
// 符号词典工具：把页面文字里的数学符号自动包成 <span class="sym">，悬停、点击或聚焦时立即显示含义；
// 并按字母顺序渲染完整符号表。两个演示页共用这一份代码，词典各自给出。
// 词典条目：{ id, show: 符号的 HTML, mean: 含义, unit: 单位或取值, keys: 能匹配到它的记号键 }
// 记号键的写法：字母 + "_下标" + "^上标"，下标里的数字写成 #，粗体向量前加 "b:"，上划线前加 "ov:"。
window.SymKit = function (entries, opts) {
  'use strict';
  opts = opts || {};
  const byKey = new Map(), byId = new Map();
  entries.forEach(e => {
    byId.set(e.id, e);
    (e.keys || [e.id]).forEach(k => { if (byKey.has(k)) throw new Error('符号键重复：' + k); byKey.set(k, e); });
  });

  const genAll = k => k.replace(/\d+/g, '#');

  const isTag = (h, p) => h[p] === '<' && /[A-Za-z\/!]/.test(h[p + 1] || '');

      const m = re.exec(html);
      if (!m) continue;
      const first = m[0][0], last = m[0][m[0].length - 1];
      if (isLatin(first) && (isLatin(html[pos - 1]) || html[pos - 1] === '′')) continue;
      if (isLatin(last) && isAlnum(html[pos + m[0].length])) continue;
      if (opts.guard && !opts.guard(html, pos, m[0], id)) continue;

    }

    RE_B.lastIndex = pos; m = RE_B.exec(html);

      if (!m) return null;

    }

    const full = base + (key[2] ? '^' + stripTags(key[2]) : '');
    let e = resolve(full);
    if (e) return { len: m[0].length, key: full, entry: e };
    if (key[2]) {

      e = resolve(base);

  function skipLen(html, pos) {
    if (html.startsWith('<span class="sym"', pos)) {
      let depth = 0, i = pos;
      for (;;) {
        const a = html.indexOf('<span', i), b = html.indexOf('</span>', i);
        if (a >= 0 && a < b) { depth++; i = a + 5; } else { depth--; i = b + 7; if (depth === 0) return i - pos; }

  }

  }

  // ---------- 即时提示 ----------

    document.body.appendChild(tip);
    return tip;
  }

    let left = r.left;
    if (left + tw > W - 4) left = W - 4 - tw;
    if (left < 4) left = 4;
    t.style.left = left + 'px'; t.style.top = top + 'px';
  }
  function show(el) {
    const t = ensureTip();
    if (cur && cur !== el) cur.classList.remove('on');
    cur = el; el.classList.add('on');
    if (el.classList.contains('sym')) {
      const e = byId.get(el.dataset.sym);
      t.innerHTML = '<div class="s">' + e.show + '</div><div class="m">' + e.mean + '</div><div class="u"><span>单位或取值</span>' + e.unit + '</div>';
    } else t.innerHTML = '<div class="m">' + el.dataset.tip + '</div>';

    place(el);
  }
  function hide() {
    if (cur) cur.classList.remove('on');

    if (tip) tip.hidden = true;
  }
  const target = node => (node && node.closest ? node.closest('.sym, [data-tip]') : null);
  function attach() {
    document.addEventListener('mouseover', e => {
      const el = target(e.target);

      else if (cur && !pinned) hide();
    });

    document.addEventListener('click', e => {
      const el = target(e.target);

      if (el === cur && pinned) { hide(); return; }

    });
    document.addEventListener('focusin', e => { const el = target(e.target); if (el) show(el); });
    document.addEventListener('focusout', e => { const el = target(e.target); if (el && el === cur && !pinned) hide(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && cur) hide(); });

    window.addEventListener('resize', () => { if (cur) place(cur); });
  }
  // 页面重绘把被悬停的元素换掉后，找同一位置、同一符号的新元素接上，找不到就收起
  function refresh() {

      const r = el.getBoundingClientRect(), d = Math.hypot(r.left - lastRect.left, r.top - lastRect.top);
      if (d < bd) { bd = d; best = el; }

      const el = document.querySelector(c + ' .sym[data-sym="' + id + '"]');
      if (el) { el.scrollIntoView({ block: 'nearest' }); show(el); pinned = true; return el; }

  }

  // ---------- 完整符号表 ----------
  const GREEK = 'αβγδεζηθικλμνξοπρστυφχψω', GREEK_U = 'ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ';
  const SCRIPT = { 'ℰ': 'E', '𝒰': 'U', '𝕀': 'I', 'ℓ': 'l' };
  function sortKey(e, idx) {
    const id = e.id.replace(/^(b:|ov:)/, ''), bold = /^b:/.test(e.id) ? 1 : 0;

        const x = a[0][k], y = b[0][k];
        if (x === y) continue;

  }

    return '<table class="symtab"><thead><tr><th>符号</th><th>含义</th><th>单位或取值</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  return { entries, byId, wrap, findUnwrapped, attach, refresh, pin, hide, tableHtml, sorted, matchAt };
};

// MCTR-SCA 演示页的符号词典。含义与单位取自《13_符号表》，演示自有的 a_i、b_i 按本页用法写。
window.SCA_SYM = window.SymKit([
  // 拉丁字母

    b.push(blk('e4', '式（4）信干噪比与容量', E4, s4));
    b.push(blk('e6', '式（6）需求满足率', E6, lab('代入') + W6s(ev)));
    var s21 = lab('代入') + '起点 ' + SY.p0 + ' = (' + num('p1', fP(m.p0[0])) + ', ' + num('p2', fP(m.p0[1])) + ') W：' + SY.W + '(' + SY.p0 + ') = ' + num('W', fW(ev.W)) + '，' + SY.F0 + ' = ' + SY.F + '(' + SY.p0 + ') = ' + num('F', fF(ev.F)) +
      '，' + SY.dl + ' = 0，所以要求 ' + SY.F + '(' + SY.pv + ') ≥ ' + num('thr', fF(m.thr)) + '；需求 ' + SYM.D(0) + ' = ' + num('D1', m.D[0]) + '，' + SYM.D(1) + ' = ' + num('D2', m.D[1]) + ' Mbps；' +
      (isFinite(m.ptot) ? '本例总功率上限取 ' + m.ptot + ' W' : '本例不设总功率上限') + '，报告中为 2000 W。';
    b.push(blk('e21', '式（21）第三阶段的优化问题', E21(m), s21));
    return fpanel(b, 'e21', ['a', 'b', 'g1'], '用两束的小例子写出容量、满足率和要解的问题：在 SGM 不低于起点的前提下，把满足率提到最高。', { kind: 'intro' });
  }

  /* 为何保持 SGM */
  function fSgm(e, u) {
    var m = ST.m, ev0 = m.ev0, sv = ST.starve, b = [];
    var e5 = SY.zi + ' = ' + SY.Ci + '/' + SY.Di + '，　' + SY.ui + ' = ' + SY.zi + ' − 1 若 ' + SY.zi + ' ≥ 1，否则 1 − 1/' + SY.zi + '，　' + SY.vi + ' = (' + SY.Ci + ' − ' + SY.Di + ')/' + SY.beta + '<br>' +
      tm('lam', SY.Li + ' = 1 − (1 − e<sup>−√(' + iv('u', 'i') + '² + ' + iv('v', 'i') + '²)</sup>)<sup>3</sup>') + '，　' + tm('F', SY.F + ' = ' + frac('1', SY.m) + ' ' + SUM + SY.Li);
    var drop = e.Lam[sv] < ev0.Lam[sv] - 0.02;
    var t = '<table class="ft"><tr><th></th><th>波束1</th><th>波束2</th></tr>';
    var cells = function (f) { return [0, 1].map(function (i) { return '<td>' + f(i) + '</td>'; }).join(''); };
    var z = [0, 1].map(function (i) { return e.C[i] / m.D[i]; });
    t += '<tr><td>' + SY.Ci + ' / Mbps</td>' + cells(function (i) { return num('C' + (i + 1), e.C[i].toFixed(1)); }) + '</tr>';
    t += '<tr><td>' + SY.zi + ' = ' + SY.Ci + '/' + SY.Di + '</td>' + cells(function (i) { return e.C[i].toFixed(1) + '/' + m.D[i] + ' = ' + num('z' + (i + 1), fx(z[i], 3)); }) + '</tr>';
    t += '<tr><td>' + SY.ui + '</td>' + cells(function (i) { return (z[i] >= 1 ? fx(z[i], 3) + ' − 1' : '1 − 1/' + fx(z[i], 3)) + ' = ' + fx(z[i] >= 1 ? z[i] - 1 : 1 - 1 / z[i], 3); }) + '</tr>';
    t += '<tr><td>' + SY.vi + ' = (' + SY.Ci + ' − ' + SY.Di + ')/' + SY.beta + '</td>' + cells(function (i) { return '(' + e.C[i].toFixed(1) + ' − ' + m.D[i] + ')/' + m.beta + ' = ' + fx((e.C[i] - m.D[i]) / m.beta, 3); }) + '</tr>';
    t += '<tr><td>' + tm('lam', SY.Li) + '</td>' + cells(function (i) { return num('L' + (i + 1), fx(e.Lam[i], 3), i === sv && drop ? 'flash' : ''); }) + '</tr></table>';
    var okF = e.F >= m.thr;
    t += tm('F', SY.F + ' = (' + fx(e.Lam[0], 3) + ' + ' + fx(e.Lam[1], 3) + ')/2 = ' + num('F', fF(e.F), okF ? '' : 'badc')) + '，　' + SY.beta + ' = (' + m.D[0] + ' + ' + m.D[1] + ')/2 = ' + m.beta + '，　' + SY.W + ' = ' + num('W', fW(e.W));
    b.push(blk('e5', '式（5）供需匹配程度 SGM，在点 (' + fP(e.p[0]) + ', ' + fP(e.p[1]) + ') W 处', e5, t));
    b.push(blk('e21', '式（21）的 SGM 约束', tm('g1', SY.F + '(' + SY.pv + ') ≥ ' + SY.F0 + ' − ' + SY.dl), lab('代入') + tm('g1', num('F', fF(e.F), okF ? 'okc' : 'badc') + ' ≥ ' + num('thr', fF(m.thr)) + ' ' + yes(okF))));
    var doing = u <= 0 ? '起点处两束的匹配得分都不低，' + H.F0 + ' = ' + fF(ev0.F) + '。接下来把点移到只看满足率的最优处。' :
      u < 1 ? '点正移向只看满足率的最优处：' + H.W + ' 在升，但波束' + (sv + 1) + '的 ' + iv('Λ', sv + 1) + ' 在变小。' :
        '到了只看满足率的最优点：' + iv('Λ', sv + 1) + ' 从 ' + fx(ev0.Lam[sv], 3) + ' 掉到 ' + fx(e.Lam[sv], 3) + '，' + H.F + ' 跌破 ' + H.F0 + '，所以要给 SGM 设下限。';
    return fpanel(b, 'e5', u > 0 ? ['lam', 'F', 'g1'] : ['lam'], doing, { kind: 'sgm', p: e.p, u: u });
  }

  /* 为何不能直接开大 */
  function fPush(e, phase) {
    var m = ST.m, ev0 = m.ev0, pb = ST.pushBeam, ob = 1 - pb, b = [];
    var e4 = E4s(0) + '，　' + E4s(1);
    var s = lab('起点') + '(' + fP(m.p0[0]) + ', ' + fP(m.p0[1]) + ') W：' + SYM.G(0) + ' = ' + num('Gz1', sig(ev0.G[0], 3)) + '，' + SYM.G(1) + ' = ' + num('Gz2', sig(ev0.G[1], 3)) + '<br>';
    for (var i = 0; i < 2; i++) s += lab('现在') + G4s(e, i) + '<br>';
    var okF = e.F >= m.thr;
    s += lab('结果') + W6s(e) + '，　' + SY.F + ' = ' + num('F', fF(e.F), okF ? 'okc' : 'badc') + ' ≥ ' + num('thr', fF(m.thr)) + ' ' + yes(okF);
    b.push(blk('e4', '式（4）简化式，分母里的 ' + iv('b', 'i') + iv('p', 'j') + ' 是对方功率造成的干扰', e4, s));
    var doing = phase === 1 ? '做法一，两束同比例加大：分子 ' + iv('a', 'i') + iv('p', 'i') + ' 和分母里的干扰项 ' + iv('b', 'i') + iv('p', 'j') + ' 一起变大，' + iv('Γ', 'i') + ' 几乎不动，' + H.W + ' 从 ' + fW(ev0.W) + ' 只变到 ' + fW(e.W) + '。' :
      '做法二，只开大波束' + (pb + 1) + '：波束' + (ob + 1) + ' 分母里的干扰项 ' + iv('b', ob + 1) + iv('p', pb + 1) + ' 随 ' + iv('p', pb + 1) + ' 增大，' + iv('Γ', ob + 1) + ' 从 ' + sig(ev0.G[ob], 3) + ' 降到 ' + sig(e.G[ob], 3) + '，' + H.F + (okF ? ' 仍达标但满足率不是最高' : ' 跌破要求') + '。';
    return fpanel(b, 'e4', phase === 1 ? ['intf1', 'intf2'] : ['intf' + (ob + 1)], doing, { kind: 'push', p: e.p, phase: phase });
  }

  /* 线性化与信赖域 */
  function fLin(lam, tau) {
    var m = ST.m, ev = m.ev0, J = ST.J0, g = ST.g0, b = [];
    var e23 = SY.J + ' = ' + frac('∂' + SY.Ci, '∂' + SY.pj) + ' = ' + SUMq + frac(SY.B, '(1 + ' + SY.Giq + ') ln 2') + ' · ' + frac(tm('own', SY.chi + SY.ind + '{<i>i</i> = <i>j</i>}') + ' − ' + tm('intf', SY.Giq + SY.psi), SY.nu);
    var s = lab('本例') + SY.chi + ' = ' + SY.ai + '，' + SY.psi + ' = ' + SY.bi + '，' + SY.nu + ' = 1 + ' + SY.bi + SY.pj + '，只有 1 个槽，不用求和。<br>';
    for (var i = 0; i < 2; i++) {
      var j = 1 - i, gg = 25 / ((1 + ev.G[i]) * Math.LN2);
      s += lab('代入') + SYM.J(i, i) + ' = ' + frac('25', '(1 + ' + sig(ev.G[i], 3) + ') ln 2') + ' × ' + frac(sig(ST.cfg.a[i], 3), num('nu' + (i + 1), sig(ev.nu[i], 3))) + ' = ' + num('J' + (i + 1) + (i + 1), sig(J[i][i], 3)) +
        '，　' + SYM.J(i, j) + ' = −' + sig(gg, 3) + ' × ' + frac(sig(ev.G[i], 3) + ' × ' + sig(ST.cfg.b[i], 3), sig(ev.nu[i], 3)) + ' = ' + num('J' + (i + 1) + (j + 1), sig(J[i][j], 3)) + ' Mbps/W<br>';
    }
    s += lab('梯度') + SY.gF + ' 的第 <i>j</i> 个分量 = ' + frac('1', SY.m) + SUM + 'Λ′<sub><i>i</i></sub>' + SY.J + '，Λ′ 是得分对容量的导数，这里 Λ′<sub>1</sub> = ' + num('dL1', gfmt(ev.dLam[0])) + '，Λ′<sub>2</sub> = ' + num('dL2', gfmt(ev.dLam[1])) +
      '，所以 ' + SY.gF + ' = (' + num('g1', gfmt(g[0])) + ', ' + num('g2', gfmt(g[1])) + ') /W';
    b.push(blk('e23', '式（23）容量对功率的导数，在 ' + H.p0 + ' 处', e23, s));
    var el = SY.Ci + '(' + SY.pk + ' + ' + SY.Dl + ') ≈ ' + SY.Cik + ' + ' + SUMj + SY.Jk + SY.dj + '，　' + SY.F + '(' + SY.pk + ' + ' + SY.Dl + ') ≈ ' + SY.Fk + ' + (' + SY.gFk + ')' + SY.T + SY.Dl;
    b.push(blk('elin', '线性化：式（24）第一、三项用到的一次近似', el, lab('代入') + SY.F + ' ≈ ' + num('F', fF(ev.F)) + linExpr(0, g, function () { return ''; }, gfmt) + '，紫色直线就是它等于 ' + num('thr', fF(m.thr)) + ' 的位置；' + SY.W + '(' + H.p0 + ') = ' + num('W', fW(ev.W))));
    b.push(blk('e24', '式（24）第四项：信赖域', tm('c4', SY.ninf + ' ≤ ' + SY.lam, 'tr'), lab('代入') + tm('c4', '|' + dI(1) + '| ≤ ' + num('lam', lam.toFixed(1)) + ' W，|' + dI(2) + '| ≤ ' + num('lam', lam.toFixed(1)) + ' W', 'tr') + '，图上橙色正方形的半边长就是 ' + H.lam + '。'));
    var doing = tau < 900 ? '在 ' + H.p0 + ' 处算出导数 ' + iv('J', 'ij') + ' 和 ' + H.gF + '，用一次式代替弯曲的容量和 SGM。' :
      tau < 5800 ? H.lam + ' 增大到 ' + lam.toFixed(1) + ' W，正方形随之扩大，红色误判区越来越多：步子大，近似就不准。' : H.lam + ' 回到初值 5 W，算法从这个大小开始。';
    return fpanel(b, tau < 900 ? 'e23' : 'e24', tau < 900 ? ['own', 'intf'] : ['c4'], doing, { kind: 'lin', lam: lam });
  }

  /* 迭代 */
  var PH_ORD = ['start', 'box', 'sgm', 'cap', 'poly', 'verts', 'solve', 'check', 'done', 'rsub', 'rsolve', 'rcheck', 'rdone'];
  function iterPhase(s) {
    if ((s.rdecide || 0) >= 1) return 'rdone';
    if ((s.rarrow || 0) >= 1) return 'rcheck';
    if ((s.rverts || 0) > 0) return 'rsolve';
    if ((s.rsq || 0) > 0) return 'rsub';
    if ((s.decide || 0) >= 1) return 'done';
    if ((s.check || 0) > 0) return 'check';
    if ((s.best || 0) > 0) return 'solve';
    if ((s.verts || 0) > 0) return 'verts';
    if ((s.poly || 0) > 0) return 'poly';
    if ((s.brk || 0) > 0) return 'cap';
    if ((s.line || 0) > 0) return 'sgm';
    if ((s.sq || 0) > 0) return 'box';
    return 'start';
  }
  function phAt(ph, x) { return PH_ORD.indexOf(ph) >= PH_ORD.indexOf(x); }
  function E24(lamH, muH) {
    return 'max<sub>' + SY.Dl + ', ' + SY.yv + '</sub> ' + tm('obj', SUM + SY.yi) + '　s.t.　' + tm('c1', SY.yi + ' ≤ ' + SY.Cik + ' + ' + SUMj + SY.Jk + SY.dj, 'brk') + '，　' + tm('c2', SY.yi + ' ≤ ' + SY.Di, 'brk') + '<br>' +
      tm('c3', SY.Fk + ' + (' + SY.gFk + ')' + SY.T + SY.Dl + ' ≥ ' + SY.F0 + ' − ' + SY.dl + ' + ' + muH + lamH + '<sup>2</sup>', 'sgm') + '，　' + tm('c4', SY.ninf + ' ≤ ' + lamH, 'tr');
  }
  function sub24(ev, J, g, lam, mu, lp, pre, showRes) {
    var m = ST.m, f2 = function (x) { return sig(x, 3); }, s = '';
    s += tm('c1', lab('第一项') + [0, 1].map(function (i) { return SYM.y(i) + ' ≤ ' + linExpr(ev.C[i], J[i], function (c) { return num(pre + 'C' + (i + 1), c.toFixed(1)); }, f2); }).join('，　'), 'brk') + '<br>';
    s += tm('c2', lab('第二项') + SYM.y(0) + ' ≤ ' + num('D1', m.D[0]) + '，　' + SYM.y(1) + ' ≤ ' + num('D2', m.D[1]), 'brk') + '<br>';
    s += tm('c3', lab('第三项') + linExpr(ev.F, g, function (c) { return num(pre + 'F', fF(c)); }, gfmt) + ' ≥ ' + fF(m.thr) + ' + ' + num(pre + 'mu', sci(mu)) + ' × ' + flam(lam) + '² = ' + num(pre + 'thrm', fF(m.thr + lp.margin)), 'sgm') + '<br>';
    s += tm('c4', lab('第四项') + '|' + dI(1) + '|, |' + dI(2) + '| ≤ ' + num(pre + 'lam', flam(lam)) + ' W，并且 0.5 ≤ ' + iv('p', 'i') + ' + ' + iv('Δ', 'i') + ' ≤ 50' + (isFinite(m.ptot) ? '，总功率 ≤ ' + m.ptot : ''), 'tr');
    if (showRes) {
      s += '<br>' + tm('res', lab('解') + (lp.feasible ? SY.Dl + ' = (' + num(pre + 'd1', sig(lp.d[0], 3)) + ', ' + num(pre + 'd2', sig(lp.d[1], 3)) + ') W，' + SUM + iv('y', 'i') + ' = ' + lp.best.val.toFixed(1) + ' Mbps，预测 ' + SY.W + ' = ' + num(pre + 'Wl', fW(ev.W + lp.pred)) + '，预测 ' + SY.F + ' = ' + num(pre + 'Fl', fF(lp.linF)) : bad('在这个范围内没有同时满足四项约束的点，子问题无解')), 'd');
    }
    return s;
  }
  function blk25(id, head, evX, ev, qW, qF) {
    var m = ST.m, upW = evX.W > ev.W + 1e-12, okF = evX.F >= m.thr;
    var e25 = tm('a1', SY.W + '(' + SY.pc + ') > ' + SY.W + '(' + SY.pk + ')', 'pc') + '，　' + tm('a2', SY.F + '(' + SY.pc + ') ≥ ' + SY.F0 + ' − ' + SY.dl, 'pc');
    var s25 = tm('a1', lab('代入') + num(qW, fW(evX.W), upW ? 'okc' : 'badc') + ' > ' + num('W', fW(ev.W)) + ' ' + yes(upW), 'pc') + '　' + tm('a2', lab('') + num(qF, fF(evX.F), okF ? 'okc' : 'badc') + ' ≥ ' + num('thr', fF(m.thr)) + ' ' + yes(okF), 'pc');
    return blk(id, head, e25, s25);
  }
  function fIter(rec, s) {
    var m = ST.m, R = rec.repair, lp = rec.lp, ph = iterPhase(s), b = [], terms = [], act = 'e24', doing = '', k = rec.k, ev = rec.ev;
    var head = '式（24）第 ' + k + ' 次迭代的子问题，在 ' + pK(k) + ' = (' + num('p1', fP(rec.p[0])) + ', ' + num('p2', fP(rec.p[1])) + ') W 处，当前 ' + H.W + ' = ' + num('W', fW(ev.W)) + '，' + H.F + ' = ' + num('F', fF(ev.F)) + (rec.muReset ? '；' + H.mu + ' 已由 ' + sci(rec.muIn) + ' 清零' : '');
    b.push(blk('e24', head, E24(SY.lam, SY.mu), sub24(ev, rec.J, rec.gF, rec.lam, rec.mu, lp, '', phAt(ph, 'solve'))));
    switch (ph) {
      case 'start': doing = '在当前点算出导数 ' + iv('J', 'ij') + ' 和 ' + H.gF + '，准备列出子问题。'; break;
      case 'box': terms = ['c4']; doing = '画信赖域：每个波束的功率改变都不超过 ' + H.lam + ' = ' + flam(rec.lam) + ' W，这就是第四项。'; break;
      case 'sgm': terms = ['c3']; doing = '画线性化的 SGM 约束直线：右端 ' + H.F0 + ' − ' + H.dl + ' + ' + H.mu + H.lam + '² = ' + fF(m.thr + lp.margin) + '，直线的一侧满足第三项。'; break;
      case 'cap': terms = ['c1', 'c2']; doing = '画灰色虚线：线性容量恰好等于需求的位置，第一项与第二项在这里交接，越过它服务量不再增加。'; break;
      case 'poly': terms = ['c1', 'c2', 'c3', 'c4']; doing = '淡紫多边形是四项约束同时成立的范围，子问题就在这里面找最优。'; break;
      case 'verts': terms = ['obj']; doing = '枚举多边形的 ' + lp.verts.length + ' 个顶点，逐个计算目标 Σ' + iv('y', 'i') + '。'; break;
      case 'solve': terms = ['res']; doing = lp.feasible && rec.pc ? '取 Σ' + iv('y', 'i') + ' 最大的顶点得到 ' + H.Dl + '，候选点 ' + H.pc + ' = ' + H.pk + ' + ' + H.Dl + ' = ' + fpt(rec.pc) + ' W。' : '子问题无解，半径减半。'; break;
    }
    if (rec.outcome === 'converged' && phAt(ph, 'solve')) doing = '预测的满足率提升只有 ' + sci(lp.pred) + '，小于 10<sup>−7</sup>：没有可提高的方向，算法停止。';
    if (rec.pc && phAt(ph, 'check')) {
      var evc = rec.evc, upW = evc.W > ev.W + 1e-12, okF = evc.F >= m.thr;
      b.push(blk25('e25', '式（25）用原模型检验候选点 ' + H.pc + ' = ' + fpt(rec.pc) + ' W', evc, ev, 'Wc', 'Fc'));
      if (ph === 'check') { act = 'e25'; terms = ['a1', 'a2']; doing = '回到原来的容量公式重算候选点：满足率' + (upW ? '提高' : '未提高') + '，SGM ' + (okF ? '达标' : '不达标') + (okF && upW ? '，两项都成立。' : okF ? '，第一项不成立。' : '，第二项不成立。'); }
      if (!okF && (s.check || 0) >= 1) {
        var dn = Math.max(ninf(lp.d), 1e-9);
        var e26 = SY.mu + ' ← max(2' + SY.mu + ', ' + frac(SY.Fk + ' + (' + SY.gFk + ')' + SY.T + SY.Dl + ' − ' + SY.F + '(' + SY.pc + ')', SY.ninf + '<sup>2</sup>') + ')';
        var s26 = lab('代入') + 'max(2 × ' + sci(rec.mu) + ', ' + frac(fF(lp.linF) + ' − ' + fF(evc.F) + ' = ' + sci(rec.err), sig(dn, 3) + '² = ' + sig(dn * dn, 3)) + ') = ' + num('muErr', sci(rec.muAfterErr));
        b.push(blk('e26', '式（26）SGM 不达标，按线性化误差加大余量系数', e26, s26));
        if (ph === 'check') { act = 'e26'; doing += '分子是线性预测与真实 SGM 之差 ' + sci(rec.err) + '，余量系数变为 ' + sci(rec.muAfterErr) + '。'; }
      }
      if (!R && phAt(ph, 'done')) {
        var up = rec.outcome === 'accept' ?
          tm('up', SY.lam + ' ← min(2' + SY.lam + ', 50) = min(' + flam(2 * rec.lam) + ', 50) = ' + num('lamNew', flam(rec.lamNew)) + ' W，　' + SY.mu + ' ← ' + SY.mu + '/2 = ' + sci(rec.mu) + '/2 = ' + num('muNew', sci(rec.muNew))) :
          tm('up', SY.lam + ' ← ' + SY.lam + '/2 = ' + flam(rec.lam) + '/2 = ' + num('lamNew', flam(rec.lamNew)) + ' W，　' + SY.mu + ' = ' + num('muNew', sci(rec.muNew)));
        b.push(blk('eup', rec.outcome === 'accept' ? '接受：当前点移到候选点，半径加倍、余量系数减半' : '拒绝：当前点不动，半径减半', up));
        act = 'eup'; terms = ['up'];
        doing = rec.outcome === 'accept' ? '式（25）两项都成立，接受候选点为 ' + pK(k + 1) + '；近似可信，所以 ' + H.lam + ' 加倍到 ' + flam(rec.lamNew) + ' W，' + H.mu + ' 减半。' : '检验不通过，拒绝候选点，' + pK(k + 1) + ' = ' + pK(k) + '，' + H.lam + ' 减半到 ' + flam(rec.lamNew) + ' W。';
      }
    }
    if (R && phAt(ph, 'rsub')) {
      var lamH = '(' + SY.lam + '/2)', muH = SY.mu;
      b.push(blk('r24', '式（24）修复子问题：在候选点 ' + H.pc + ' = ' + fpt(rec.pc) + ' W 处重新线性化，半径 ' + H.lam + '/2 = ' + flam(R.lam) + ' W', E24(lamH, muH).split('data-t="').join('data-t="r'), sub24(rec.evc, R.J, R.gF, R.lam, R.mu, R.lp, 'r', phAt(ph, 'rsolve')).split('data-t="').join('data-t="r')));
      act = 'r24';
      if (ph === 'rsub') { terms = ['rc3', 'rc4']; doing = '候选点 SGM 差 ' + sci(m.thr - rec.evc.F) + ' 但满足率提高了：在候选点重新线性化，以半径 ' + flam(R.lam) + ' W、余量 ' + sci(R.lp.margin) + ' 再解一个子问题把 SGM 补回来。'; }
      if (ph === 'rsolve') { terms = ['rres']; doing = R.lp.feasible ? '解修复子问题，' + H.Dl + ' = (' + sig(R.lp.d[0], 3) + ', ' + sig(R.lp.d[1], 3) + ') W，修复点 ' + fpt(R.p) + ' W。' : '修复子问题无解：这么小的范围内线性模型也找不到能把 SGM 补回来的方向。'; }
      if (R.lp.feasible && phAt(ph, 'rcheck')) {
        var okR = R.ev.F >= m.thr, upR = R.ev.W > ev.W + 1e-12;
        b.push(blk25('r25', '式（25）检验修复点 ' + fpt(R.p) + ' W，仍与 ' + pK(k) + ' 比较', R.ev, ev, 'Wr', 'Fr').split('data-t="').join('data-t="r'));
        if (ph === 'rcheck') { act = 'r25'; terms = ['ra1', 'ra2']; doing = '按式（25）检验修复点：满足率' + (upR ? '仍高于' : '没有超过') + ' ' + pK(k) + '，SGM ' + (okR ? '达标' : '仍不达标') + '。'; }
      }
      if (phAt(ph, 'rdone')) {
        var upr = rec.outcome === 'repair-accept' ?
          tm('rup', SY.lam + ' 保持 ' + num('lamNew', flam(rec.lamNew)) + ' W，　' + SY.mu + ' 保持更新后的 ' + num('muNew', sci(rec.muNew))) :
          tm('rup', SY.lam + ' ← ' + SY.lam + '/2 = ' + num('lamNew', flam(rec.lamNew)) + ' W，　' + SY.mu + ' 保留为 ' + num('muNew', sci(rec.muNew)));
        b.push(blk('rup', rec.outcome === 'repair-accept' ? '接受修复点：半径和余量系数都不变' : '修复失败，拒绝：当前点不动，半径减半', upr));
        act = 'rup'; terms = ['rup'];
        doing = rec.outcome === 'repair-accept' ? '修复点通过式（25），接受为 ' + pK(k + 1) + '；半径保持 ' + flam(rec.lamNew) + ' W，余量系数保持 ' + sci(rec.muNew) + '。' : '修复没有成功，拒绝候选点，' + pK(k + 1) + ' = ' + pK(k) + '，' + H.lam + ' 减半到 ' + flam(rec.lamNew) + ' W。';
      }
    }
    return fpanel(b, act, terms, doing, { kind: 'iter', k: k, phase: ph });
  }

  /* 结果 */

  /* 对比：式（28）回退 */
  function fCmp(fb, pm, nd) {
    var m = ST.m, b = [], q = Math.max(0, Math.min(20, nd - 1)), pt = fb.pts[q], pick = fb.pick, lastOk = null;
    fb.pts.forEach(function (c) { if (c.ok) lastOk = c; });
    var e28 = tm('x', sy('pxi', H.p + '(' + SY.xi + ')') + ' = ' + SY.p0 + ' + ' + SY.xi + '(' + SY.pm + ' − ' + SY.p0 + ')') + '，　' + SY.xi + ' ∈ {0, 0.05, …, 1}';
    var strip = '<span class="xs">' + fb.pts.map(function (c, i) {
      if (i > q) return '<span class="xc" style="border-color:#ddd"></span>';
      return '<span class="xc ' + (c.ok ? 'ok' : 'no') + (nd >= 21 && c === pick ? ' pk' : '') + (nd >= 21 && c === lastOk ? ' last' : '') + '" title="ξ = ' + c.xi.toFixed(2) + '，W = ' + fW(c.ev.W) + '，F = ' + fF(c.ev.F) + '"></span>';
    }).join('') + '</span>';
    var s = lab('代入') + SY.xi + ' = ' + num('xi', pt.xi.toFixed(2)) + '：' + H.p + '(' + SY.xi + ') = ' + fpt(m.p0) + ' + ' + pt.xi.toFixed(2) + ' × [' + fpt(pm) + ' − ' + fpt(m.p0) + '] = (' + num('p1', fP(pt.p[0])) + ', ' + num('p2', fP(pt.p[1])) + ') W<br>' +
      lab('原模型') + SY.W + ' = ' + num('W', fW(pt.ev.W)) + '，' + SY.F + ' = ' + num('F', fF(pt.ev.F), pt.ok ? 'okc' : 'badc') + ' ≥ ' + num('thr', fF(m.thr)) + ' ' + yes(pt.ok) + '<br>' + strip;
    if (nd >= 21) {
      s += lastOk ? '橙色虚框：满足 ' + H.F + ' ≥ ' + H.F0 + ' 的最后一个点 ' + SY.xi + ' = ' + lastOk.xi.toFixed(2) + '；' : '';
      s += '蓝圈：达标点中 ' + H.W + ' 最高者 ' + SY.xi + ' = ' + num('pickXi', pick.xi.toFixed(2)) + '，' + SY.W + ' = ' + num('pickW', fW(pick.ev.W)) + (fb.direct ? '，方法输出本身达标且满足率不降，直接采用' : '') + '。';
    }
    b.push(blk('e28', '式（28）对比方法的回退：沿 ' + H.p0 + ' 到 ' + H.pm + ' 的连线取 21 个点', e28, s));
    var doing = nd < 21 ? SY.xi + ' 从 0 到 1 扫描连线上的 21 个点，每个点用原模型算 ' + H.W + ' 和 ' + H.F + '，看 SGM 是否达标。' :
      fb.direct ? '方法输出本身满足 SGM 且满足率不降，直接采用 ' + SY.xi + ' = 1。' : '绿点达标，红点不达标；取达标点中 ' + H.W + ' 最高的 ' + SY.xi + ' = ' + pick.xi.toFixed(2) + ' 作为回退结果，只能沿一条直线找。';
    return fpanel(b, 'e28', ['x'], doing, { kind: 'cmp', q: q, pm: pm });
  }

  /* 悬停联动：公式项 → 图上元素闪烁 */
  function drawHover() {
    if (!HOV) return;
    var m = ST.m, pulse = 0.5 + 0.5 * Math.sin(performance.now() / 150);
    ctx.save(); ctx.globalAlpha = 0.45 + 0.55 * pulse;
    if (HOV === 'tr' && HG.tr) square(HG.tr.c, HG.tr.r, '#e07b1a', { dash: [], lw: 3.5 + 2.5 * pulse });
    else if (HOV === 'sgm' && HG.sgm) segment(HG.sgm[0], HG.sgm[1], '#8b5fd6', 4 + 2.5 * pulse);
    else if (HOV === 'brk' && HG.brk) HG.brk.forEach(function (sg) { segment(sg[0], sg[1], '#5f656c', 3.5 + 1.5 * pulse, [6, 4]); });
    else if ((HOV === 'p' || HOV === 'p1' || HOV === 'p2') && HG.p) {
      var a = px(HG.p);
      ctx.strokeStyle = COL.navy; ctx.lineWidth = 1.6; ctx.setLineDash([4, 4]); ctx.beginPath();
      if (HOV !== 'p2') { ctx.moveTo(a[0], a[1]); ctx.lineTo(a[0], PR.T + PR.S); }
      if (HOV !== 'p1') { ctx.moveTo(a[0], a[1]); ctx.lineTo(PR.L, a[1]); }
      ctx.stroke(); ctx.setLineDash([]);
      ring(HG.p, 9 + 4 * pulse, COL.navy, 2.5);
      if (HOV !== 'p2') rich(a[0], PR.T + PR.S - 6, [['p', 'i'], ['1', 'sub'], [' = ' + fP(HG.p[0]), 'n']], { color: COL.navy, size: 13, align: 'center' });
      if (HOV !== 'p1') rich(PR.L + 4, a[1] - 6, [['p', 'i'], ['2', 'sub'], [' = ' + fP(HG.p[1]), 'n']], { color: COL.navy, size: 13 });
    }
    else if (HOV === 'pc' && HG.pc) ring(HG.pc, 9 + 4 * pulse, COL.tr, 2.5);
    else if (HOV === 'p0') ring(m.p0, 10 + 4 * pulse, '#262a30', 2.5);
    else if (HOV === 'pm' && HG.pm) ring(HG.pm, 10 + 4 * pulse, COL.navy, 2.5);
    else if (HOV === 'd' && HG.d) arrow(HG.d[0], HG.d[1], 1, '#e07b1a', 3 + 2 * pulse);
    ctx.restore();
  }

  /* ---------------- 视野 ---------------- */
  function zoomTo(pts, factor, minSide) {
    var x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    pts.forEach(function (q) { x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); });
    var side = Math.max(Math.max(x1 - x0, y1 - y0) * factor, minSide);
    if (side >= 30) return FULL;
    return { x0: (x0 + x1) / 2 - side / 2, y0: (y0 + y1) / 2 - side / 2, s: side };
  }
  function iterView(rec, phase) {
    var step = 0, pts = [rec.p];
    if (rec.pc) { pts.push(rec.pc); step = Math.max(Math.abs(rec.pc[0] - rec.p[0]), Math.abs(rec.pc[1] - rec.p[1])); }
    if (rec.repair && rec.repair.p) { pts.push(rec.repair.p); step = Math.max(step, Math.abs(rec.repair.p[0] - rec.p[0]), Math.abs(rec.repair.p[1] - rec.p[1])); }
    if (phase === 'lin') return rec.lam >= 2.5 ? FULL : zoomTo([[rec.p[0] - rec.lam, rec.p[1] - rec.lam], [rec.p[0] + rec.lam, rec.p[1] + rec.lam]], 1.5, 0.3);
    if (step >= 2.5) return FULL;
    return zoomTo(pts, 6, 0.3);
  }

        if (isFinite(m.ptot)) { var b = px([m.ptot - 46, 46]); txt(b[0] + 8, b[1] - 4, '总功率上限 ' + m.ptot + ' W', { color: '#6b655b', size: 12.5 }); }

      var html = P('<b>这一步做什么：</b>说明报告中对其它功率方法的统一处理，并和 MCTR-SCA 比较。') + intro +
        P('报告的统一处理是：方法输出若满足 SGM 要求且 ' + H.W + ' 不低于原功率，直接采用；否则在 ' + H.p0 + ' 与输出 ' + H.pm + ' 的连线上等间距取 21 个点，即式（28）的 ' + H.p + '(<i>ξ</i>) = ' + H.p0 + ' + <i>ξ</i>(' + H.pm + ' − ' + H.p0 + ')，<i>ξ</i> = 0, 0.05, …, 1，从满足 SGM 的点里取 ' + H.W + ' 最高者。') +
        (fb.direct ? P('这里输出本身满足 SGM，' + H.W + ' = ' + fW(fb.evm.W) + ' 不低于原来的 ' + fW(ev0.W) + '，所以<b>直接采用</b>。') :
          P('图中绿点满足 SGM，红点不满足。选中的是 <i>ξ</i> = ' + pick.xi.toFixed(2) + ' 处的点 ' + fpt(pick.p) + ' W，' + H.W + ' = ' + fW(pick.ev.W) + '。')) +
        P('这样处理后，任何方法的 SGM 和满足率都不会比第二阶段差，可以在同一要求下公平比较。但这种回退只能沿一条直线找，MCTR-SCA 则沿着可行区域的边界一步步走，得到 ' + H.W + ' = <span class="hl">' + fW(fin.W) + '</span>，比回退结果' + (fin.W > pick.ev.W ? '高 ' + fW(fin.W - pick.ev.W) : '不低') + '。');
      push({ chip: ci, title: title, feas: true, view: FULL, kh: st.hist.length, dur: 3400, html: html,
        paint: function (tau) {
          ctx.save(); ctx.globalAlpha = 0.35; drawHistory(nIt, null); ctx.restore();
          var u = ph(tau, 0, 600);
          ctx.save(); ctx.globalAlpha = u; segment(m.p0, pm, '#8a8f96', 1.4, [5, 4]); ctx.restore();
          var okm = fb.evm.F >= m.thr;
          ring(pm, 7, okm ? COL.good : COL.bad, 2.4);
          var a = px(pm), sd = side(pm); rich(a[0] + sd.dx, a[1] + 22, [['p', 'b'], ['m', 'sup'], [' 方法输出 ', 'n'], ['F', 'i'], [' = ' + fF(fb.evm.F), 'n']], { color: okm ? COL.good : COL.bad, size: 13, align: sd.align });
          var nd = Math.floor(ph(tau, 600, 1500) * 21);
          for (var q = 0; q < nd; q++) { var d = fb.pts[q]; if (d.ok) dot(d.p, 3.6, COL.good, '#fff', 1); else dot(d.p, 3.6, '#fff', COL.bad, 1.5); }
          if (tau > 2300) { var b = px(pick.p); ctx.strokeStyle = COL.navy; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b[0], b[1], 10, 0, 2 * Math.PI); ctx.stroke(); rich(b[0] - 12, b[1] + 22, [['回退结果 ', 'n'], ['W', 'i'], [' = ' + fW(pick.ev.W), 'n']], { color: COL.navy, size: 13, align: 'right' }); }
          if (tau > 2800) { star(st.R.p, 10, COL.star); var c2 = px(st.R.p); rich(c2[0] - 12, c2[1] - 14, [['MCTR-SCA ', 'n'], ['W', 'i'], [' = ' + fW(fin.W), 'n']], { color: COL.navy, size: 13, align: 'right' }); }
          drawP0(); HG.pm = pm; HG.p = nd > 0 ? fb.pts[Math.min(20, nd - 1)].p : m.p0;
        },
        panel: function () {
          return { cols: [colP0, { h: '方法输出 ' + H.pm, p: pm, W: fb.evm.W, F: fb.evm.F, ref: ev0.W }, { h: fb.direct ? '直接采用' : '回退结果', p: pick.p, W: pick.ev.W, F: pick.ev.F, ref: ev0.W }, { h: 'MCTR-SCA', p: st.R.p, W: fin.W, F: fin.F, ref: ev0.W }],
            kv: kv0, cur: ev0, cand: pick.ev, cname: '回退结果', hist: st.hist.length };
        },
        formula: function (tau) { return fCmp(fb, pm, Math.floor(ph(tau, 600, 1500) * 21)); } });
    }
    cmpFrame('对比一：只看满足率的方法', P('其它方法大多不管 SGM。例如以按需求封顶的和速率为目标的加权最小均方误差方法 WMMSE，目标其实就是满足率。这里用网格穷举直接取满足率最高的点 ' + H.pm + ' = ' + fpt(gU.p) + ' W，代表这类方法最理想的输出：' + H.W + ' = ' + fW(gU.W) + '，但 ' + H.F + ' = ' + fF(gU.F) + '，在可行区域之外。'), gU.p, st.fbU);
    var eqP = st.eq.p;
    cmpFrame('对比二：等功率分配', P('等功率分配是报告中的另一种对比方法：两束取相同功率，' + (isFinite(m.ptot) && m.ptot / 2 < m.pmax ? '在总功率 ' + m.ptot + ' W 内各取 ' + fP(eqP[0]) + ' W' : '都开到 50 W') + '，得到 ' + H.W + ' = ' + fW(st.eq.W) + '，' + H.F + ' = ' + fF(st.eq.F) + '。'), eqP, st.fbE);

    st.frames = F; st.chips = chips;
  }

  /* ---------------- 导航与播放 ---------------- */
  function buildNav() {
    $('chips').innerHTML = WS(ST.chips.map(function (c, i) { return '<span class="chip ' + c.cls + '" data-i="' + i + '">' + c.label + '</span>'; }).join(''));
    $('ticks').innerHTML = ST.frames.map(function (f, i) { return '<span data-f="' + i + '" title="第 ' + (i + 1) + ' 步"></span>'; }).join('');
    $('presets').innerHTML = '<span>预设例子</span>' + SCA.PRESETS.map(function (p, i) { return '<button data-p="' + i + '" class="' + (i === ST.idx ? 'on' : '') + '">' + p.name + '</button>'; }).join('');
  }
  function updateNav() {
    var fr = ST.frames[cur];
    Array.prototype.forEach.call($('chips').children, function (el, i) { el.classList.toggle('on', i === fr.chip); });
    Array.prototype.forEach.call($('ticks').children, function (el, i) { el.className = i === cur ? 'on' : i < cur ? 'done' : ''; });
    $('frameNo').textContent = '第 ' + (cur + 1) + ' / ' + ST.frames.length + ' 步';
    $('stepNo').textContent = ST.chips[fr.chip].label.replace(/<[^>]+>/g, '');
  }
  function targetView(fr) { return autoZoom ? fr.view : FULL; }
  function setView(t, instant) {
    if (instant) { V = { x0: t.x0, y0: t.y0, s: t.s }; VT = null; return; }
    if (Math.abs(t.x0 - V.x0) < 1e-12 && Math.abs(t.y0 - V.y0) < 1e-12 && Math.abs(t.s - V.s) < 1e-12) { VT = null; return; }
    VT = { from: { x0: V.x0, y0: V.y0, s: V.s }, to: t, start: performance.now(), dur: 800 };
  }
  function goTo(i, instant) {
    cur = Math.max(0, Math.min(ST.frames.length - 1, i));
    tau = 0; holdT = 0; animating = true;
    var fr = ST.frames[cur];
    $('stepTitle').innerHTML = fr.title;
    $('stepText').innerHTML = WS(fr.html);
    $('stepText').scrollTop = 0;
    setView(targetView(fr), instant);
    updateNav();
    renderAll();
  }
  function setPlaying(v) { playing = v; if (v) animating = true; else animating = false; $('btnPlay').textContent = v ? '暂停' : '播放'; $('btnPlay').classList.toggle('on', v); }
  function renderAll() {
    var fr = ST.frames[cur], t = Math.min(tau, fr.dur);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, CW, CH);
    var bg = getBg(V, fr.feas, VT ? 80 : 200, PR.S);
    ctx.drawImage(bg.cv, PR.L, PR.T, PR.S, PR.S);
    drawAxes(bg);
    ctx.save(); ctx.beginPath(); ctx.rect(PR.L, PR.T, PR.S, PR.S); ctx.clip();
    HG = {};
    fr.paint(t);
    drawHover();
    ctx.restore();
    if (V.s < FULL.s * 0.6) drawInset(fr);
    ctx.strokeStyle = '#b5afa3'; ctx.lineWidth = 1; ctx.setLineDash([]); ctx.strokeRect(PR.L + 0.5, PR.T + 0.5, PR.S - 1, PR.S - 1);
    updatePanel(fr.panel(t));
    lastFormula = fr.formula(t);
    setHTML('formula', lastFormula.html);
    if (lastFormula.act !== lastAct) {   // 当前起作用的公式块滚入视野
      lastAct = lastFormula.act;
      var fo = $('formula'), el = fo.querySelector ? fo.querySelector('.fq.act') : null;
      if (el && typeof el.offsetTop === 'number') fo.scrollTop = Math.max(0, el.offsetTop - 4);
    }
    SK.refresh();
  }
  function loop(ts) {
    var dt = lastTs ? Math.min(100, ts - lastTs) : 16; lastTs = ts;
    var fr = ST.frames[cur], changed = false;
    if (VT) {
      var u = ease((performance.now() - VT.start) / VT.dur), a = VT.from, b = VT.to;
      var ls = Math.log(a.s) + (Math.log(b.s) - Math.log(a.s)) * u, s = Math.exp(ls);
      var cx = a.x0 + a.s / 2 + (b.x0 + b.s / 2 - a.x0 - a.s / 2) * u, cy = a.y0 + a.s / 2 + (b.y0 + b.s / 2 - a.y0 - a.s / 2) * u;
      V = { x0: cx - s / 2, y0: cy - s / 2, s: s };
      if (u >= 1) { V = { x0: b.x0, y0: b.y0, s: b.s }; VT = null; }
      changed = true;
    }
    if (playing || animating) {
      if (tau < fr.dur) {
        tau = Math.min(fr.dur, tau + dt * speed); changed = true;
        if (tau >= fr.dur && !playing) animating = false;
      } else if (playing) {
        holdT += dt * speed;
        if (holdT >= fr.hold) { if (cur < ST.frames.length - 1) goTo(cur + 1); else setPlaying(false); }
      }
    }
    if (changed || HOV) renderAll();
    requestAnimationFrame(loop);
  }
  function loadPreset(i, instant) {
    BG = {}; lastPanel = {};
    ST = build(i);
    buildNav();
    goTo(0, true);
  }

  $('btnPrev').onclick = function () { goTo(cur - 1); };
  $('btnNext').onclick = function () { goTo(cur + 1); };
  $('btnReplay').onclick = function () { goTo(cur, true); };
  $('btnPlay').onclick = function () {
    if (playing) { setPlaying(false); return; }
    if (cur === ST.frames.length - 1 && tau >= ST.frames[cur].dur) goTo(0);
    setPlaying(true);
  };
  $('speed').onchange = function () { speed = +this.value; };
  $('autoZoom').onchange = function () { autoZoom = this.checked; setView(targetView(ST.frames[cur])); };
  $('chips').onclick = function (e) { var el = e.target.closest('.chip'); if (el) goTo(ST.chips[+el.getAttribute('data-i')].first); };
  $('ticks').onclick = function (e) { var f = e.target.getAttribute('data-f'); if (f !== null) goTo(+f); };
  $('presets').onclick = function (e) { var el = e.target.closest('button'); if (el) { setPlaying(false); loadPreset(+el.getAttribute('data-p')); } };
  // 悬停公式项，图上对应元素闪烁；移开即恢复
  $('formula').addEventListener('mouseover', function (e) { var el = e.target.closest ? e.target.closest('[data-link]') : null, l = el ? el.getAttribute('data-link') : null; if (l !== HOV) { HOV = l; renderAll(); } });
  $('formula').addEventListener('mouseleave', function () { if (HOV) { HOV = null; renderAll(); } });
  // 完整符号表弹窗；图例里的符号也包裹
  var symtab = $('symtab');
  function showSym(on) { symtab.hidden = !on; }
  $('symtabBody').innerHTML = SK.tableHtml();
  $('legend').innerHTML = WS($('legend').innerHTML);
  $('btnSym').onclick = function () { showSym(symtab.hidden); };
  $('symtabClose').onclick = function () { showSym(false); };
  symtab.addEventListener('click', function (e) { if (e.target === symtab) showSym(false); });
  SK.attach();
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { showSym(false); return; }
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') { goTo(cur + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { goTo(cur - 1); e.preventDefault(); }
    else if (e.key === ' ') { $('btnPlay').click(); e.preventDefault(); }
    else if (e.key === 'r' || e.key === 'R') goTo(cur, true);
  });
  window.addEventListener('resize', function () { resize(); renderAll(); });

  /* ---------------- 启动；网址后加 #p=1&f=7&end 可直接打开某一步的末态，&hov=tr 模拟悬停某一公式项，
     &hovsym=W 模拟悬停某个符号并显示浮层（&hovin=stepText 指定区域），&symtab 打开符号表，#selftest 逐步自检 ---------------- */
  function hashArgs() {
    var o = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) { if (!kv) return; var a = kv.split('='); o[a[0]] = a.length > 1 ? a[1] : true; });
    return o;
  }
  function selftest() {
    var lines = [], errors = 0;
    for (var i = 0; i < SCA.PRESETS.length; i++) {
      loadPreset(i, true);
      var tr = ST.trace, mono = true, feas = true;
      for (var k = 1; k < ST.hist.length; k++) {
        if (ST.hist[k].ev.W < ST.hist[k - 1].ev.W) mono = false;
        if (ST.hist[k].ev.F < ST.m.thr) feas = false;
      }
      for (var f = 0; f < ST.frames.length; f++) {
        try {
          goTo(f, true);
          [0, 0.33, 0.66, 1].forEach(function (u) {
            tau = ST.frames[f].dur * u; renderAll();
            var fh = lastFormula.html;
            if (!/data-q="[^"]+">[^<]/.test(fh) || !/<div class="fd">[^<]/.test(fh)) { errors++; lines.push('预设' + i + ' 第' + f + '步公式面板缺数字或缺说明'); }
          });
        } catch (err) { errors++; lines.push('预设' + i + ' 第' + f + '步出错：' + err.message); }
      }
      lines.push('预设' + i + '：' + ST.frames.length + ' 步；迭代结果 ' + tr.map(function (r) { return r.outcome; }).join(',') +
        '；W ' + ST.m.ev0.W.toFixed(4) + '→' + ST.R.ev.W.toFixed(4) + '；接受点 W 单调 ' + mono + '，SGM 达标 ' + feas);
    }
    lines.unshift('SELFTEST ' + (errors ? 'FAIL' : 'OK') + ' errors=' + errors + ' pageErrors=' + ERR.length);
    var el = $('selftest'); el.textContent = lines.join('\n'); el.style.display = 'block';
  }

  resize();
  // 测试钩子：test_sca.js 在 Node 里用桩 DOM 运行本脚本后，通过它逐步取公式面板
  window.SCA_UI = { state: function () { return ST; }, goTo: goTo, setTau: function (t) { tau = t; animating = false; renderAll(); }, formula: function () { return lastFormula; }, html: function (id) { return $(id).innerHTML; }, errors: ERR, sym: SK };
  var args = hashArgs();
  if (args.selftest) { selftest(); return; }
  loadPreset(+(args.p || 0), true);
  if (args.nozoom) { autoZoom = false; $('autoZoom').checked = false; }
  if (args.f) goTo(+args.f, true);
  if (args.hov) HOV = args.hov;
  if (args.end) { tau = ST.frames[cur].dur; animating = false; renderAll(); }
  if (args.t) { tau = +args.t; animating = false; renderAll(); }
  if (args.hovsym) SK.pin(decodeURIComponent(args.hovsym), args.hovin ? ['#' + args.hovin] : ['#stepText', '#formula', '#metrics', '#legend']);
  if (args.symtab) showSym(true);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
